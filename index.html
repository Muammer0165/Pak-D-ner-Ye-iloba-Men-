<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Mobile Geniş Veritabanı & Arama Merkezi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #030712, #0f172a, #1e1b4b);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
      perspective: 1000px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Arka Planda Uçan Simgeler */
    .bg-animation {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; z-index: -1; pointer-events: none;
    }
    .floating-item {
      position: absolute; width: 20px; height: 20px;
      animation: fly 15s linear infinite; bottom: -100px; font-size: 24px; opacity: 0.4;
    }
    @keyframes fly {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
      100% { transform: translateY(-900px) rotate(360deg); opacity: 0; }
    }

    header {
      text-align: center; margin-bottom: 15px; width: 100%; max-width: 480px;
    }
    header h1 {
      font-size: 1.8rem;
      background: linear-gradient(45deg, #38bdf8, #818cf8, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }
    header p {
      font-size: 0.8rem; color: #38bdf8; margin-top: 3px; text-transform: uppercase; letter-spacing: 1px;
    }

    .container {
      width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px;
    }

    /* Arama Motoru Kutusu */
    .search-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      border-radius: 16px;
      padding: 12px 15px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .search-box input {
      width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 1rem;
    }
    .search-box input::placeholder { color: rgba(255,255,255,0.5); }

    /* 3D Cam Kart */
    .card-3d {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    /* FUT Kart Tasarımı */
    .fut-card {
      background: linear-gradient(135deg, #1e1b4b, #312e81, #0f172a);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
      border: 2px solid #38bdf8;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      transition: transform 0.2s;
    }
    .fut-card:hover { transform: scale(1.01); }
    .fut-card:last-child { margin-bottom: 0; }

    .fut-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .fut-ovr {
      font-size: 1.7rem; font-weight: 900; color: #facc15; line-height: 1;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }
    .fut-pos {
      font-size: 0.85rem; font-weight: bold; color: #fff; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
    }

    .fut-body {
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    }
    .fut-img {
      width: 70px; height: 70px; object-fit: cover; border-radius: 50%;
      border: 2px solid #38bdf8; box-shadow: 0 4px 10px rgba(0,0,0,0.8);
      background: #000;
    }
    .fut-info h3 { font-size: 1.1rem; font-weight: 900; color: #fff; }
    .fut-info p { font-size: 0.75rem; opacity: 0.8; color: #cbd5e1; }

    /* İstatistik Çubuğu */
    .fut-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 10px; font-size: 0.75rem; text-align: center; border: 1px solid rgba(255,255,255,0.08);
    }
    .stat-item b { color: #38bdf8; display: block; font-size: 0.9rem; }

    .no-result {
      text-align: center; padding: 20px; opacity: 0.6; font-size: 0.9rem;
    }

    .footer {
      font-size: 0.75rem; opacity: 0.5; text-align: center; margin-top: 10px;
    }
  </style>
</head>

    function renderPlayers(list) {
      const container = document.getElementById('playerList');
      const noResult = document.getElementById('noResult');
      container.innerHTML = '';

      if (list.length === 0) {
        noResult.style.display = 'block';
        return;
      } else {
        noResult.style.display = 'none';
      }

      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'fut-card';
        card.innerHTML = `
          <div class="fut-header">
            <div>
              <div class="fut-ovr">${p.ovr}</div>
              <div style="font-size: 0.65rem; opacity: 0.7; color: #38bdf8;">FC MOBILE PRO</div>
            </div>
            <div class="fut-pos">${p.pos}</div>
          </div>
          <div class="fut-body">
            <img src="${p.img}" class="fut-img" alt="${p.name}">
            <div class="fut-info">
              <h3>${p.name}</h3>
              <p>${p.club}</p>
            </div>
          </div>
          <div class="fut-stats">
            <div class="stat-item">HIZ <b>${p.pace}</b></div>
            <div class="stat-item">ŞUT <b>${p.shooting}</b></div>
            <div class="stat-item">PAS <b>${p.passing}</b></div>
            <div class="stat-item">DRİB <b>${p.dribbling}</b></div>
            <div class="stat-item">DEF <b>${p.defending}</b></div>
            <div class="stat-item">FİZ <b>${p.physical}</b></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterPlayers() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = playersDatabase.filter(p => p.name.toLowerCase().includes(query) || p.pos.toLowerCase().includes(query) || p.club.toLowerCase().includes(query));
      renderPlayers(filtered);
    }

    // İlk açılışta tüm listeyi yükle
    window.onload = () => {
      renderPlayers(playersDatabase);
    };
  </script>
