<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC MOBILE 3D HUB</title>

<style>

/* =========================
   TEMEL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,#4c00ff44,transparent 30%),
        radial-gradient(circle at 90% 20%,#00eaff33,transparent 30%),
        radial-gradient(circle at 50% 100%,#ff006633,transparent 35%),
        #050611;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}


/* =========================
   ARKA PLAN
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(#ffffff05 1px,transparent 1px),
        linear-gradient(90deg,#ffffff05 1px,transparent 1px);
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom,black,transparent);
}


/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:rgba(5,6,17,.72);
    backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 10px 40px #0008;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#8d5cff;
}

.logo small{
    display:block;
    font-size:8px;
    letter-spacing:3px;
    color:#777;
    margin-top:3px;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:white;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:500px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:90px 20px 70px;

    position:relative;
}

.hero::before{
    content:"";
    position:absolute;

    width:500px;
    height:500px;

    background:#6c2cff;
    filter:blur(170px);
    opacity:.2;

    border-radius:50%;
}

.hero-content{
    position:relative;
    z-index:2;
}

.live{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:9px 17px;

    border:1px solid #ff3155;
    border-radius:50px;

    background:#ff315512;

    color:#ff5774;

    font-size:12px;
    font-weight:bold;

    box-shadow:0 0 25px #ff174455;
}

.live-dot{
    width:8px;
    height:8px;
    background:#ff3155;
    border-radius:50%;

    box-shadow:0 0 15px #ff3155;

    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{
        opacity:.3;
        transform:scale(.7);
    }
}

.hero h1{
    margin-top:25px;

    font-size:clamp(42px,7vw,82px);

    line-height:.95;

    font-weight:1000;

    letter-spacing:-4px;
}

.gradient{
    background:linear-gradient(
        90deg,
        #8d5cff,
        #00eaff,
        #ff4fd8
    );

    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#9295a9;
    max-width:650px;
    margin:25px auto;
    line-height:1.7;
}


/* =========================
   SEARCH
========================= */

.search{
    width:min(700px,94vw);

    margin:35px auto 0;

    display:flex;

    padding:8px;

    background:#ffffff0b;

    border:1px solid #ffffff18;

    border-radius:20px;

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 60px #0007,
        inset 0 1px #ffffff15;
}

.search input{
    flex:1;

    border:0;
    outline:0;

    background:transparent;

    color:white;

    padding:17px;

    font-size:16px;
}

.search button{
    border:0;

    padding:0 25px;

    border-radius:14px;

    background:linear-gradient(
        135deg,
        #7d3cff,
        #b13cff
    );

    color:white;

    font-weight:900;

    cursor:pointer;

    box-shadow:0 0 25px #7d3cff55;
}


/* =========================
   CONTAINER
========================= */

.container{
    width:min(1400px,94%);
    margin:auto;
}


/* =========================
   SECTION
========================= */

.section{
    padding:70px 0;
}

.section-head{
    display:flex;
    align-items:end;
    justify-content:space-between;

    margin-bottom:35px;
}

.section-head h2{
    font-size:34px;
}

.section-head p{
    color:#777b91;
    margin-top:8px;
}

.section-label{
    color:#9d72ff;
    font-size:11px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:8px;
}


/* =========================
   FILTER
========================= */

.filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.filter{
    padding:10px 18px;

    border-radius:30px;

    border:1px solid #ffffff12;

    background:#ffffff07;

    color:#999;

    cursor:pointer;

    font-weight:bold;
}

.filter.active{
    background:#7d3cff;
    color:white;
    border-color:#9e73ff;
    box-shadow:0 0 25px #7d3cff55;
}


/* =========================
   CARD GRID
========================= */

.cards{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(250px,1fr));

    gap:28px;
}


/* =========================
   PLAYER CARD
========================= */

.card-wrap{
    perspective:1200px;
}

.player-card{
    position:relative;

    height:390px;

    border-radius:25px;

    overflow:hidden;

    transform-style:preserve-3d;

    transition:
        transform .18s ease,
        box-shadow .3s;

    cursor:pointer;

    background:
        linear-gradient(
            145deg,
            #23113f,
            #0c0920 50%,
            #15102e
        );

    border:1px solid #ffffff22;

    box-shadow:
        0 25px 70px #0009,
        inset 0 1px #ffffff2b;
}

.player-card:hover{
    box-shadow:
        0 35px 100px #000,
        0 0 45px var(--glow);
}


/* kart parlama */

.player-card::before{
    content:"";

    position:absolute;

    width:220px;
    height:500px;

    top:-100px;
    left:-300px;

    transform:rotate(25deg);

    background:linear-gradient(
        transparent,
        #ffffff20,
        transparent
    );

    transition:.7s;
}

.player-card:hover::before{
    left:500px;
}


/* OVR */

.ovr{
    position:absolute;

    top:24px;
    left:24px;

    z-index:5;

    text-align:center;

    transform:translateZ(50px);
}

.ovr-number{
    font-size:48px;
    line-height:.8;
    font-weight:1000;
}

.ovr-text{
    font-size:10px;
    letter-spacing:2px;
    color:#aaa;
}


/* POS */

.position{
    margin-top:10px;

    font-size:12
